<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Mamadou Lamine Konate - AI and Big Data Engineer - MINELATECH">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF6F61"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      @keyframes dash { to { stroke-dashoffset: -1000; } }
      @keyframes pulse { 0%,100% { opacity:.35; r:4 } 50% { opacity:1; r:6 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes sweep { 0% { opacity:0 } 15% { opacity:1 } 100% { opacity:0; transform: translateX(60px) } }
      .grid { stroke:#1E293B; stroke-width:1; opacity:.5 }
      .edge { stroke:url(#accent); stroke-width:1.5; fill:none; opacity:.55;
              stroke-dasharray:6 8; animation: dash 14s linear infinite }
      .node { fill:#0D1117; stroke:url(#accent); stroke-width:2 }
      .core { fill:#6366F1; animation: pulse 3s ease-in-out infinite }
      .n2 { animation: pulse 3s ease-in-out infinite .6s }
      .n3 { animation: pulse 3s ease-in-out infinite 1.2s }
      .n4 { animation: pulse 3s ease-in-out infinite 1.8s }
      .n5 { animation: pulse 3s ease-in-out infinite 2.4s }
      .wm  { font-family: 'JetBrains Mono','Courier New',monospace; letter-spacing:6px }
      .h1  { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:800 }
      .h2  { font-family: 'JetBrains Mono','Courier New',monospace; font-weight:600 }
      .chip{ font-family: 'JetBrains Mono','Courier New',monospace; font-weight:600; fill:#94A3B8 }
      .grp { animation: float 6s ease-in-out infinite }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#glow)"/>

  <!-- faint grid -->
  <g class="grid">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280 M0 300 H1280"/>
    <path d="M160 0 V340 M320 0 V340 M480 0 V340 M640 0 V340 M800 0 V340 M960 0 V340 M1120 0 V340"/>
  </g>

  <!-- agent network (right side) -->
  <g class="grp" transform="translate(0,0)">
    <!-- edges from orchestrator core to specialized agents -->
    <path class="edge" d="M1000 170 L850 80"/>
    <path class="edge" d="M1000 170 L1180 80"/>
    <path class="edge" d="M1000 170 L840 250"/>
    <path class="edge" d="M1000 170 L1190 250"/>
    <path class="edge" d="M1000 170 L1060 60"/>
    <path class="edge" d="M1000 170 L960 290"/>

    <!-- outer nodes -->
    <circle class="node" cx="850"  cy="80"  r="14"/><circle class="core n2" cx="850"  cy="80"  r="4"/>
    <circle class="node" cx="1180" cy="80"  r="14"/><circle class="core n3" cx="1180" cy="80"  r="4"/>
    <circle class="node" cx="840"  cy="250" r="14"/><circle class="core n4" cx="840"  cy="250" r="4"/>
    <circle class="node" cx="1190" cy="250" r="14"/><circle class="core n5" cx="1190" cy="250" r="4"/>
    <circle class="node" cx="1060" cy="60"  r="12"/><circle class="core n3" cx="1060" cy="60"  r="4"/>
    <circle class="node" cx="960"  cy="290" r="12"/><circle class="core n4" cx="960"  cy="290" r="4"/>

    <!-- orchestrator core -->
    <circle cx="1000" cy="170" r="30" fill="#0D1117" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1000" cy="170" r="30" fill="#6366F1" opacity="0.10" filter="url(#soft)"/>
    <circle class="core" cx="1000" cy="170" r="7"/>
  </g>

  <!-- accent bar -->
  <rect x="64" y="66" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- text block -->
  <text x="64" y="60" class="wm" font-size="16" fill="#6366F1">M I N E L A T E C H</text>

  <text x="62" y="150" class="h1" font-size="58" fill="url(#name)">Mamadou Lamine Konaté</text>

  <text x="64" y="196" class="h2" font-size="22" fill="#A5B4FC">AI &amp; Big Data Engineer · Full-Stack Developer</text>

  <!-- animated tagline underline sweep -->
  <g opacity="0.9">
    <text x="64" y="232" class="h2" font-size="16" fill="#64748B">&gt; building</text>
    <text x="150" y="232" class="h2" font-size="16" fill="#E2E8F0">LLM apps · RAG systems · autonomous agents</text>
    <rect x="150" y="240" width="330" height="2" fill="url(#accent)"/>
    <rect x="150" y="240" width="46" height="2" fill="#FF6F61" style="animation: sweep 3.5s ease-in-out infinite"/>
  </g>

  <!-- stack chips -->
  <g transform="translate(64,270)">
    <g>
      <rect x="0"   y="0" width="86"  height="30" rx="15" fill="#0D1117" stroke="#1E293B"/>
      <text x="43"  y="20" class="chip" font-size="13" text-anchor="middle">Python</text>
    </g>
    <g>
      <rect x="96"  y="0" width="92"  height="30" rx="15" fill="#0D1117" stroke="#1E293B"/>
      <text x="142" y="20" class="chip" font-size="13" text-anchor="middle">FastAPI</text>
    </g>
    <g>
      <rect x="198" y="0" width="112" height="30" rx="15" fill="#0D1117" stroke="#1E293B"/>
      <text x="254" y="20" class="chip" font-size="13" text-anchor="middle">LangGraph</text>
    </g>
    <g>
      <rect x="320" y="0" width="84"  height="30" rx="15" fill="#0D1117" stroke="#1E293B"/>
      <text x="362" y="20" class="chip" font-size="13" text-anchor="middle">React</text>
    </g>
    <g>
      <rect x="414" y="0" width="90"  height="30" rx="15" fill="#0D1117" stroke="#1E293B"/>
      <text x="459" y="20" class="chip" font-size="13" text-anchor="middle">Flutter</text>
    </g>
    <g>
      <rect x="514" y="0" width="80"  height="30" rx="15" fill="#0D1117" stroke="#1E293B"/>
      <text x="554" y="20" class="chip" font-size="13" text-anchor="middle">Kafka</text>
    </g>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="1278" height="338" rx="20" fill="none" stroke="#1E293B"/>
</svg>
